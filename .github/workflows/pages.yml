name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true

      - name: Enable GitHub Pages (branch gh-pages)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            gh api "repos/${{ github.repository }}/pages" -X PUT \
              -f build_type=legacy \
              -f 'source[branch]=gh-pages' \
              -f 'source[path]=/'
          else
            gh api "repos/${{ github.repository }}/pages" -X POST \
              -f build_type=legacy \
              -f 'source[branch]=gh-pages' \
              -f 'source[path]=/'
          fi
